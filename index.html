<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #result { margin-top: 1rem; }
    .notice { padding: .75rem 1rem; border-radius: .4rem; }
    .notice.warn { background: #fff4d6; border: 1px solid #e0b84c; }
    .notice.error { background: #fde8e8; border: 1px solid #d77; }
    .topic { font-weight: 600; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <div id="result" aria-live="polite">
    <p id="status" class="notice" hidden></p>
    <div id="success" hidden>
      <p>Тема: <span id="topic" class="topic"></span></p>
      <label for="draft">Черновик ответа (проверьте перед отправкой)</label>
      <textarea id="draft" rows="5"></textarea>
    </div>
  </div>
  <script type="module">
    const TOPICS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };
    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const success = document.querySelector("#success");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");

    function clearResult() {
      success.hidden = true;
      topic.textContent = "";
      draft.value = "";
      status.hidden = true;
      status.textContent = "";
      status.className = "notice";
    }

    function showNotice(text, kind) {
      status.textContent = text;
      status.className = `notice ${kind}`;
      status.hidden = false;
    }

    function render(httpStatus, data) {
      if (httpStatus === 200 && data.status === "ready") {
        topic.textContent = TOPICS[data.topic] ?? data.topic;
        draft.value = data.draft;
        success.hidden = false;
      } else if (httpStatus === 200 && data.status === "manual_review") {
        showNotice("AI не смог надёжно разобрать заявку. Определите тему и подготовьте ответ вручную.", "warn");
      } else if (httpStatus === 400) {
        showNotice("Введите текст заявки.", "error");
      } else {
        showNotice("Сервис временно недоступен. Разберите заявку вручную или попробуйте позже.", "error");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearResult();
      button.disabled = true;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
        });
        const data = await reply.json().catch(() => ({}));
        render(reply.status, data);
      } catch {
        render(0, {});
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
